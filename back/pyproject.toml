[project]
name = "dano-back"
version = "0.1.0"
description = "Dano 重写(阶段一+三):Python 主体 + pi SDK Node Sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "hvac>=2.3",
    "structlog>=24.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["aiohttp>=3.10", "pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7",
       "qrcode>=7.4"]   # 仅用于 QR 编码器对拍测试,生产不依赖
page = ["playwright>=1.48"]   # 录制 V2 浏览器依赖:装后 `python -m playwright install chromium`

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = "../.runtime/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = "../.runtime/ruff-cache"

[tool.ruff.lint.per-file-ignores]
# Split modules resolve some helpers via owner-module bind after import.
# Ruff cannot see those names; runtime bind plus architecture tests cover them.
"dano/execution/page/capability_*.py" = ["F821"]
"dano/execution/page/flow_spec_core/*.py" = ["F821"]
"dano/execution/page/flow_materialization/**/*.py" = ["F821"]
"dano/execution/page/recording_facts.py" = ["F821"]
"dano/execution/page/recording_analysis_state.py" = ["F821"]
"dano/execution/page/recording_agent_contract.py" = ["F821"]
"dano/execution/page/flow_release.py" = ["F821"]
"dano/execution/page/flow_client_projection.py" = ["F821"]
"dano/execution/page/flow_spec_validate.py" = ["F821"]
"scripts/*.py" = ["F841"]
