<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>请假申请</title>
</head>
<body>
  <form id="filter">
    <label>请假类型
      <div class="el-select" role="combobox">
        <input id="leave-type" placeholder="请选择请假类型" readonly value="" />
      </div>
    </label>
    <label>单据编号 <input id="bill" placeholder="请输入单据编号" /></label>
    <button id="search" type="button">搜索</button>
    <button id="create" type="button">新增</button>
  </form>
  <div id="dropdown" class="el-select-dropdown" hidden>
    <div class="el-select-dropdown__item" role="option">事假</div>
    <div class="el-select-dropdown__item" role="option">病假</div>
  </div>
  <script>
    const input = document.getElementById("leave-type");
    const dropdown = document.getElementById("dropdown");
    const open = () => { dropdown.hidden = false; };
    const close = () => { dropdown.hidden = true; };
    const toggle = (event) => {
      event.stopPropagation();
      dropdown.hidden = !dropdown.hidden;
    };
    document.querySelector(".el-select").addEventListener("click", toggle);
    dropdown.querySelectorAll("[role=option]").forEach((item) => {
      item.addEventListener("click", () => {
        input.value = item.textContent;
        close();
        fetch("/api/dict/duty_leave_type").catch(() => {});
      });
    });
    document.getElementById("search").addEventListener("click", () => {
      fetch("/api/leave/list?type=" + encodeURIComponent(input.value)).catch(() => {});
    });
  </script>
</body>
</html>
