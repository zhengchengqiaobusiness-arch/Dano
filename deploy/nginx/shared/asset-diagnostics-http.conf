log_format dano_asset escape=json
  '{"event":"dano_asset","at":"$time_iso8601","id":"$request_id",'
  '"method":"$request_method","asset":"$uri","status":$status,'
  '"sent":$body_bytes_sent,"complete":"$request_completion",'
  '"contentType":"$sent_http_content_type","contentLength":"$sent_http_content_length",'
  '"encoding":"$sent_http_content_encoding","seconds":$request_time,'
  '"upstreamStatus":"$upstream_status","upstreamBytes":"$upstream_response_length",'
  '"upstreamHeaderSeconds":"$upstream_header_time","upstreamSeconds":"$upstream_response_time"}';
