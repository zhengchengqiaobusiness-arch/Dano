name: dano

services:
  app:
    image: ${DANO_IMAGE:-dano-app:local}
    restart: unless-stopped
    cap_add:
      - ALL
    security_opt:
      - seccomp=unconfined
    environment:
      DANO_HOST: 0.0.0.0
      DANO_PORT: 8080
      DANO_RUNTIME_DIR: /opt/dano/runtime-data
      DANO_HOST_DATA_DIR: /var/lib/dano-host
      DANO_HOST_UID: ${DANO_HOST_UID:-1000}
      DANO_HOST_GID: ${DANO_HOST_GID:-1000}
      DANO_MAX_WORKERS: ${DANO_MAX_WORKERS:-16}
      DANO_WORKER_FIRST_UID: ${DANO_WORKER_FIRST_UID:-10001}
      DANO_WORKER_FIRST_GID: ${DANO_WORKER_FIRST_GID:-10001}
      DANO_WORKER_IDENTITY_COUNT: ${DANO_WORKER_IDENTITY_COUNT:-50000}
      DANO_PRODUCT_NAME: ${DANO_PRODUCT_NAME:-}
      DANO_SESSIONS_ROOT: /opt/dano/runtime-data/.dano/sessions
      DANO_UPLOAD_DIR: /opt/dano/runtime-data/.dano/uploads
      DANO_UPLOAD_MAX_TOTAL_BYTES: ${DANO_UPLOAD_MAX_TOTAL_BYTES:-10737418240}
      DANO_UPLOAD_DRAFT_TTL_MS: ${DANO_UPLOAD_DRAFT_TTL_MS:-7200000}
      DANO_UPLOAD_REFERENCED_TTL_MS: ${DANO_UPLOAD_REFERENCED_TTL_MS:-86400000}
      DANO_UPLOAD_ORPHANED_TTL_MS: ${DANO_UPLOAD_ORPHANED_TTL_MS:-300000}
      DANO_UPLOAD_CLEANUP_INTERVAL_MS: ${DANO_UPLOAD_CLEANUP_INTERVAL_MS:-3600000}
      DANO_ANONYMOUS_IDLE_TTL_MS: ${DANO_ANONYMOUS_IDLE_TTL_MS:-86400000}
      DANO_ANONYMOUS_CLEANUP_INTERVAL_MS: ${DANO_ANONYMOUS_CLEANUP_INTERVAL_MS:-3600000}
      DANO_LOGIN_SESSION_IDLE_TTL_MS: ${DANO_LOGIN_SESSION_IDLE_TTL_MS:-28800000}
      DANO_LOGIN_SESSION_ABSOLUTE_TTL_MS: ${DANO_LOGIN_SESSION_ABSOLUTE_TTL_MS:-604800000}
      DANO_LOGIN_SESSION_CLEANUP_INTERVAL_MS: ${DANO_LOGIN_SESSION_CLEANUP_INTERVAL_MS:-3600000}
      DANO_OAUTH_ISSUER: ${DANO_OAUTH_ISSUER:?DANO_OAUTH_ISSUER is required}
      DANO_OAUTH_AUTHORIZATION_ENDPOINT: ${DANO_OAUTH_AUTHORIZATION_ENDPOINT:?DANO_OAUTH_AUTHORIZATION_ENDPOINT is required}
      DANO_OAUTH_ALLOW_INSECURE_AUTHORIZATION_ENDPOINT: ${DANO_OAUTH_ALLOW_INSECURE_AUTHORIZATION_ENDPOINT:-false}
      DANO_OAUTH_ALLOW_INSECURE_SERVER_ENDPOINTS: ${DANO_OAUTH_ALLOW_INSECURE_SERVER_ENDPOINTS:-false}
      DANO_OAUTH_TOKEN_ENDPOINT: ${DANO_OAUTH_TOKEN_ENDPOINT:?DANO_OAUTH_TOKEN_ENDPOINT is required}
      DANO_OAUTH_IDENTITY_ENDPOINT: ${DANO_OAUTH_IDENTITY_ENDPOINT:?DANO_OAUTH_IDENTITY_ENDPOINT is required}
      DANO_OAUTH_IDENTITY_TRANSPORT: ${DANO_OAUTH_IDENTITY_TRANSPORT:-bearer-get}
      DANO_OAUTH_PROFILE_ENDPOINT: ${DANO_OAUTH_PROFILE_ENDPOINT:-}
      DANO_OAUTH_API_ORIGIN: ${DANO_OAUTH_API_ORIGIN:?DANO_OAUTH_API_ORIGIN is required}
      DANO_OAUTH_CLIENT_ID: ${DANO_OAUTH_CLIENT_ID:?DANO_OAUTH_CLIENT_ID is required}
      DANO_OAUTH_CLIENT_SECRET: ${DANO_OAUTH_CLIENT_SECRET:?DANO_OAUTH_CLIENT_SECRET is required}
      DANO_OAUTH_CLIENT_AUTH_METHOD: ${DANO_OAUTH_CLIENT_AUTH_METHOD:-client_secret_post}
      DANO_OAUTH_SCOPE: ${DANO_OAUTH_SCOPE:?DANO_OAUTH_SCOPE is required}
      DANO_OAUTH_PROVIDER_HEADERS_JSON: ${DANO_OAUTH_PROVIDER_HEADERS_JSON:-}
      DANO_OAUTH_SEND_STATE_TO_TOKEN_ENDPOINT: ${DANO_OAUTH_SEND_STATE_TO_TOKEN_ENDPOINT:-false}
      DANO_OAUTH_REVOCATION_TRANSPORT: ${DANO_OAUTH_REVOCATION_TRANSPORT:-}
      DANO_OAUTH_REVOCATION_ENDPOINT: ${DANO_OAUTH_REVOCATION_ENDPOINT:-}
      DANO_OAUTH_REDIRECT_URI: ${DANO_OAUTH_REDIRECT_URI:?DANO_OAUTH_REDIRECT_URI is required}
      DANO_OAUTH_CREDENTIAL_KEY: ${DANO_OAUTH_CREDENTIAL_KEY:?DANO_OAUTH_CREDENTIAL_KEY is required}
      DANO_OAUTH_CREDENTIAL_KEY_VERSION: ${DANO_OAUTH_CREDENTIAL_KEY_VERSION:?DANO_OAUTH_CREDENTIAL_KEY_VERSION is required}
      OPEN_WEBSEARCH_HOST: 127.0.0.1
      OPEN_WEBSEARCH_PORT: 3210
      DEFAULT_SEARCH_ENGINE: ${OPEN_WEBSEARCH_DEFAULT_SEARCH_ENGINE:-duckduckgo}
      ALLOWED_SEARCH_ENGINES: ${OPEN_WEBSEARCH_ALLOWED_SEARCH_ENGINES:-}
      SEARCH_MODE: ${OPEN_WEBSEARCH_SEARCH_MODE:-auto}
      USE_PROXY: ${OPEN_WEBSEARCH_USE_PROXY:-false}
      PROXY_URL: ${OPEN_WEBSEARCH_PROXY_URL:-}
      FAKE_IP_CIDRS: ${OPEN_WEBSEARCH_FAKE_IP_CIDRS:-}
      FETCH_WEB_INSECURE_TLS: ${OPEN_WEBSEARCH_FETCH_WEB_INSECURE_TLS:-false}
      # 接入同机 skillmanner 网关(dano agent 的 A-OA skill 经此执行真实动作)。
      # 实际值由部署方在 .env 注入;切勿把 DANO_TENANT_KEY 提交进仓库。
      DANO_URL: ${DANO_URL:-}
      DANO_TENANT_KEY: ${DANO_TENANT_KEY:-}
      AGENT_WORLD_API_KEY: ${AGENT_WORLD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_TOKEN_PLAN_CN_API_KEY: ${XIAOMI_TOKEN_PLAN_CN_API_KEY:-}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
      DEEPSEEK_API_KEY_FILE: ${DEEPSEEK_API_KEY_FILE:-}
    expose:
      - "8080"
    volumes:
      - ${DANO_RUNTIME_DIR:-/opt/dano/runtime-data}:/opt/dano/runtime-data
      - host-state:/var/lib/dano-host
      - agent-config:/opt/dano/runtime-data/.pi
      - workspaces:/opt/dano/runtime-data/workspaces
      - ${DANO_SECRETS_DIR:-/opt/dano/deploy/.secrets}:/run/secrets:ro
    networks:
      - default
      - skillmanner
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_FILTER: ^DANO_
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ${DANO_NGINX_CONF:-/opt/dano/deploy/nginx/default.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ${DANO_NGINX_SHARED_DIR:-/opt/dano/deploy/nginx/shared}:/etc/nginx/dano:ro
    networks:
      - default
      - skillmanner

networks:
  default:
  # skillmanner 是同机业务动作网关的 Compose 网络;A-OA skill 通过它执行真实业务动作。
  # 该网络由 skillmanner 的 compose 创建。独立部署 Dano 且不接业务网关时,
  # 删掉本段以及 app/nginx 下的 skillmanner networks 引用即可。
  skillmanner:
    external: true
    name: skillmanner_default

volumes:
  host-state:
  agent-config:
  workspaces:
