<!doctype html>
<html>
<body>
  <h1>内层</h1>
  <button id="inner-a" type="button">提交</button>
  <button id="inner-b" type="button">提交</button>
  <script>
    window.clicks = { a: 0, b: 0 };
    document.querySelector("#inner-a").addEventListener("click", () => { window.clicks.a += 1; });
    document.querySelector("#inner-b").addEventListener("click", () => {
      window.clicks.b += 1;
      fetch("/api/save", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
    });
  </script>
</body>
</html>
