<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Dano Skill</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0c1016; color: #c5cdd6; font-family: "Segoe UI", sans-serif; }
    .studio-root { height: 100%; display: flex; flex-direction: column; }
    header { height: 64px; padding: 0 20px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; border-bottom: 1px solid #1a222c; background: #10161c; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: #ecfdf5; background: radial-gradient(circle at 35% 30%, #4aa89a, #1a4a44 70%); }
    .brand b { display: block; color: #f8fafc; }
    .brand span, .hint, .muted { color: #94a3b8; font-size: 12px; }
    nav { display: flex; justify-content: center; gap: 8px; }
    nav button { background: transparent; color: #94a3b8; border: 0; border-bottom: 2px solid transparent; height: 64px; padding: 0 18px; cursor: pointer; font-size: 14px; }
    nav button.active { color: #f8fafc; border-bottom-color: #14b8a6; }
    main { flex: 1; min-height: 0; padding: 12px; box-sizing: border-box; }
    section { display: none; height: 100%; }
    section.active { display: flex; flex-direction: column; min-height: 0; }
    .card { background: #10161c; border: 1px solid #1a222c; border-radius: 8px; padding: 16px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row + .row { margin-top: 12px; align-items: flex-start; }
    label { white-space: nowrap; color: #e2e8f0; }
    label i { color: #f87171; font-style: normal; }
    input, textarea { background: #0c1016; color: #f8fafc; border: 1px solid #243140; border-radius: 6px; padding: 8px 10px; font: inherit; }
    input { height: 36px; box-sizing: border-box; }
    #start_url { flex: 1.4; min-width: 160px; }
    #title { flex: 0.8; min-width: 120px; }
    #goal_text { width: 100%; box-sizing: border-box; min-height: 64px; }
    .primary { background: #0f766e; color: white; border: 0; border-radius: 6px; height: 36px; padding: 0 16px; cursor: pointer; }
    .host { position: relative; flex: 1; min-height: 0; border-radius: 8px; background: #070b10; border: 1px solid #1a222c; overflow: hidden; }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .banner { position: absolute; top: 0; left: 0; right: 0; z-index: 3; background: #78350f; color: #ffedd5; padding: 8px 12px; }
    .live { position: absolute; left: 10px; bottom: 10px; z-index: 2; padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; }
    .empty { height: 100%; display: grid; place-items: center; color: #94a3b8; }
    .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    #skills { list-style: none; padding: 0; margin: 0; overflow: auto; }
    #skills li { padding: 10px 0; border-bottom: 1px solid #1a222c; }
    #headers { width: 100%; min-height: 72px; box-sizing: border-box; }
    #keytrap { position: absolute; width: 1px; height: 1px; opacity: 0; }
  </style>
</head>
<body>
  <div class="studio-root">
    <header>
      <div class="brand">
        <div class="logo">π</div>
        <div><b>Dano Skill</b><span>真实操作 · 可执行 Skill</span></div>
      </div>
      <nav>
        <button type="button" data-step="1" class="active">录制准备</button>
        <button type="button" data-step="2">页面录制</button>
        <button type="button" data-step="3">Skill 目录</button>
      </nav>
      <div class="muted" id="tenant-tag"></div>
    </header>
    <main>
      <section id="step-1" class="active">
        <div class="card">
          <div class="row">
            <label><i>* </i>业务地址</label>
            <input id="start_url" placeholder="https://example.com/business/page">
            <label>Skill 名称</label>
            <input id="title" placeholder="例如：请假申请">
            <button id="begin" class="primary" type="button">开始录制</button>
          </div>
          <div class="row">
            <label><i>* </i>录制目标</label>
            <div style="flex:1">
              <textarea id="goal_text" placeholder="查询记录、保存草稿并提交申请"></textarea>
              <div class="hint">会按当前页面快照操作。你也可以随时点预览。登录或验证码出现时，在同一个画面里处理。</div>
            </div>
          </div>
          <div class="row">
            <label>tenant</label>
            <input id="tenant">
            <label>subsystem</label>
            <input id="subsystem" value="app">
          </div>
        </div>
      </section>
      <section id="step-2">
        <div class="host" id="host">
          <img id="preview" alt="预览">
          <div class="banner" id="assist" hidden></div>
          <div class="live" id="live" hidden>正在自动操作，你也可以直接点预览</div>
          <div class="empty" id="empty">正在打开业务页面</div>
          <input id="keytrap" aria-label="录制页面键盘输入">
        </div>
        <div class="bar">
          <button id="resume" class="primary" type="button" hidden>继续</button>
          <span class="hint" id="skill_dir"></span>
        </div>
      </section>
      <section id="step-3">
        <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column;">
          <div class="row">
            <label>导出目录</label>
            <input id="out_dir" style="flex:1">
            <button id="save-dir" class="primary" type="button">保存目录</button>
            <button id="export-skill" class="primary" type="button">导出</button>
          </div>
          <div class="row">
            <label>token 头</label>
            <textarea id="headers" placeholder='{"Authorization":"Bearer ..."}'></textarea>
            <button id="save-token" class="primary" type="button">保存 token</button>
          </div>
          <pre class="hint" id="token-view"></pre>
          <ul id="skills"></ul>
        </div>
      </section>
    </main>
  </div>
  <script>
    const apiBase = new URLSearchParams(location.search).get("api")
      || (location.port === "19082" ? "http://127.0.0.1:19081" : location.origin);
    const apiUrl = (path) => new URL(path, apiBase).toString();
    const wsUrl = () => {
      const url = new URL("/onboarding/page/record", apiBase);
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      return url.toString();
    };
    const steps = [...document.querySelectorAll("section")];
    function show(n) {
      steps.forEach((node) => node.classList.toggle("active", node.id === `step-${n}`));
      document.querySelectorAll("nav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.step === String(n));
      });
      if (String(n) === "3") loadSkills();
    }
    document.querySelectorAll("nav button").forEach((button) => {
      button.onclick = () => show(button.dataset.step);
    });
    let socket;
    let runId = "";
    const preview = document.querySelector("#preview");
    const host = document.querySelector("#host");
    document.querySelector("#begin").onclick = () => {
      const startUrl = document.querySelector("#start_url").value.trim();
      const goalText = document.querySelector("#goal_text").value.trim();
      if (!startUrl || !goalText) return;
      show(2);
      document.querySelector("#empty").hidden = false;
      document.querySelector("#empty").textContent = "正在打开业务页面";
      document.querySelector("#tenant-tag").textContent = document.querySelector("#tenant").value;
      socket = new WebSocket(wsUrl());
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "frame" && message.data) {
          preview.src = `data:image/jpeg;base64,${message.data}`;
          preview.style.display = "block";
          document.querySelector("#empty").hidden = true;
          document.querySelector("#live").hidden = false;
        }
        if (message.type === "snapshot" && message.snapshot) {
          const snap = message.snapshot;
          runId = snap.run_id || runId;
          const reason = snap.assist?.reason || "";
          const banner = document.querySelector("#assist");
          banner.hidden = !reason;
          banner.textContent = reason;
          document.querySelector("#resume").hidden = snap.status !== "waiting_operator";
          document.querySelector("#skill_dir").textContent = snap.skill_dir || "";
          if (snap.status === "skill_ready" || snap.status === "skill_written_needs_auth" || snap.status === "verify_failed" || snap.status === "stopped") {
            document.querySelector("#live").hidden = true;
          }
        }
      };
      socket.onopen = () => {
        socket.send(JSON.stringify({
          type: "start",
          title: document.querySelector("#title").value,
          start_url: startUrl,
          goal_text: goalText,
          tenant: document.querySelector("#tenant").value,
          subsystem: document.querySelector("#subsystem").value,
        }));
      };
    };
    function sendPoint(kind, event) {
      if (!socket || socket.readyState !== 1 || preview.style.display === "none") return;
      const rect = preview.getBoundingClientRect();
      socket.send(JSON.stringify({
        type: "input",
        event: { kind, nx: (event.clientX - rect.left) / rect.width, ny: (event.clientY - rect.top) / rect.height, button: event.button === 2 ? "right" : "left" },
      }));
      document.querySelector("#keytrap").focus();
    }
    host.onpointerdown = (event) => sendPoint("pointer_down", event);
    host.onpointerup = (event) => sendPoint("pointer_up", event);
    host.onpointermove = (event) => sendPoint("pointer_move", event);
    host.onwheel = (event) => {
      if (!socket || socket.readyState !== 1) return;
      socket.send(JSON.stringify({ type: "input", event: { kind: "scroll", dx: event.deltaX, dy: event.deltaY } }));
      event.preventDefault();
    };
    host.oncontextmenu = (event) => event.preventDefault();
    const keytrap = document.querySelector("#keytrap");
    keytrap.onkeydown = (event) => {
      const keys = ["Backspace", "Delete", "Enter", "Tab", "Escape", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
      if (!keys.includes(event.key) || !socket || socket.readyState !== 1) return;
      socket.send(JSON.stringify({ type: "input", event: { kind: "key", key: event.key } }));
      event.preventDefault();
    };
    keytrap.oninput = () => {
      if (!keytrap.value || !socket || socket.readyState !== 1) return;
      socket.send(JSON.stringify({ type: "input", event: { kind: "text", text: keytrap.value } }));
      keytrap.value = "";
    };
    document.querySelector("#resume").onclick = () => {
      socket?.send(JSON.stringify({ type: "steer", text: "" }));
    };
    async function loadSkills() {
      const data = await (await fetch(apiUrl("/v1/skills"))).json();
      const list = document.querySelector("#skills");
      list.innerHTML = "";
      for (const item of data.items || []) {
        const li = document.createElement("li");
        li.textContent = `${item.title || item.name}  ${item.subsystem || ""}  ${item.recording_id || ""}`;
        list.appendChild(li);
      }
    }
    document.querySelector("#save-dir").onclick = async () => {
      await fetch(apiUrl("/export/directory"), { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ out_dir: document.querySelector("#out_dir").value }) });
    };
    document.querySelector("#save-token").onclick = async () => {
      const headers = JSON.parse(document.querySelector("#headers").value || "{}");
      const saved = await (await fetch(apiUrl("/v1/settings/token"), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          tenant: document.querySelector("#tenant").value,
          subsystem: document.querySelector("#subsystem").value,
          headers,
        }),
      })).json();
      document.querySelector("#token-view").textContent = JSON.stringify(saved.headers || {});
    };
    document.querySelector("#export-skill").onclick = async () => {
      if (!String(runId).startsWith("rec_")) return;
      await fetch(apiUrl(`/v1/pi-recordings/${encodeURIComponent(runId)}/export-skill`), {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ out_dir: document.querySelector("#out_dir").value }),
      });
    };
    fetch(apiUrl("/export/directory")).then((res) => res.json()).then((data) => {
      document.querySelector("#out_dir").value = data.out_dir || "";
    }).catch(() => {});
  </script>
</body>
</html>
